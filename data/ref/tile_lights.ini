# Lighting of the map tiles in hardware mode, by tile number. Edit it in a mission
# with the light editor (Escape menu), or by hand :
#   glow   = how the pixels shine in the dark : none (the default), bright (the brightest ones), full (the whole tile)
#   light  = if the tile lights up what's around it : auto (when it has a lamp), none, on
#   radius = size of the light in pixels, 0 for automatic
#   colour = colour of the light : r,g,b or auto (from the tile)
tile=33 glow=none light=on radius=0 colour=auto
