# Development configuration used by the VS Code launch configurations
# (freesynd -i dev -u dev/user). Paths are relative to the workspace root,
# which is the working directory when launched from VS Code.

# FreeSynd's own data (lang, cursors, ref)
freesynd_data_dir = data

# Original Syndicate "DATA" directory (GOG release)
data_dir = game_data/SYNDICAT/DATA

# timeout to distinguish between click and dragging event
time_for_click = 80

# Music files replacing the songs of the game (optional) : assassinate.mp3 (city),
# danger.mp3 (combat), intro, mission_completed, mission_failed, game_completed
# (mp3, ogg, flac or wav). Songs without a file use the original MIDI music.
music_dir = game_data/music
