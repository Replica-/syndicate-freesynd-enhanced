fullscreen = true
play_intro = false
# hardware : GPU rendering with the enhancements (extra company colours,
# faster menu transitions). software : original behaviour, for comparison.
# The --software command line option overrides this setting.
render_mode = hardware
# Time of day in missions, hardware mode : 0 = the mission's own look, 1 = day,
# 2 = dusk, 3 = night, 4 = dawn
time_of_day = 3
# Time of day in missions, software mode : 0 = palette of the mission,
# 1 to 5 = hpal01 to hpal05
mission_palette = 1
# The GOG data has different mission briefing files (missNN.dat) than the
# reference checksums, so the startup data test is disabled.
test_data = false
language = 0
save_data_dir = dev/user/save
sound_volume = 0
